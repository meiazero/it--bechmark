[package]
name = "ofdm-rust"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "ofdm-rust"
path = "src/main.rs"

[dependencies]
rustfft = "6"
num-complex = "0.4.6"
rand = { version = "0.9.4", features = ["small_rng"] }
rand_distr = "0.5.1"
rayon = "1.12.0"
serde = "1"
serde_json = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
